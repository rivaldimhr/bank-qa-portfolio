# Setiap kali workbook QA manual di-push, setiap hari pukul 06.00 WIB, atau dijalankan manual:
#   1. Unit test skrip sinkronisasi
#   2. Baris Failed tanpa Bug ID -> tiket Bug di Jira; status Jira ditulis balik ke Excel
#   3. RTM dan Bug Report di Excel diperbarui; perubahan di-commit kembali ke repo
#   4. Dashboard dipublikasikan ke branch gh-pages
# Butuh repository variables JIRA_BASE_URL, JIRA_PROJECT_KEY dan secrets JIRA_EMAIL, JIRA_API_TOKEN.
# Tanpa itu skrip berjalan dalam mode lokal (tanpa tiket Jira).
name: Manual QA sync

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "evidence/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/manual-qa-sync.yml"
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-qa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -q -r requirements.txt

      - name: Unit test skrip sinkronisasi
        run: python -m pytest -q tests

      - name: Sinkronkan workbook dengan Jira
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/sync.py --workbook manual/ParaBank-Manual-QA.xlsx --site site

      - name: Commit workbook yang diperbarui
        run: |
          if git diff --quiet -- manual/; then
            echo "Workbook tidak berubah."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add manual/
          git commit -m "Sinkron Bug ID dan status Jira ke workbook [skip ci]"
          git push

      - name: Publikasikan dashboard ke gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
